# Multi-Band Compressor -- Cmackg. Written by tools/make_skin_art.py: edit the design there and rerun it, not this file.
# One page: globals on top, the gain curve display, then one column per band (power, name, solo; INPUT, RATIO,
# OUTPUT; XOVER and the gain-reduction meter). Themed parts: one line per theme (when=theme:<n>). Layout y = skin y + 86.

theme_ink=e6eef6
theme_ink_dim=7d8b9a
theme_accent=d7dce2
theme_accent_hi=ffffff
theme_line=2b3746
theme_box=10151b
theme_lcd=0a0e13
theme_seg_active=d7dce2
theme_seg_inactive=121820
theme_seg_active_tx=06121c
art_css=popup.css

[tab COMPRESSOR]
art file="artwork/bg_grey.svg" when=theme:0
art file="artwork/bg_classic.svg" when=theme:1
art file="artwork/bg_white.svg" when=theme:2
art file="artwork/bg_silver.svg" when=theme:3

# theme: its name between the arrows
readout cx=1050 cy=115 w=72 h=38 box=0 tsize=26 tcolor=eef1f4 label="THEME" key=theme

# SPEED: attack and release for every band (a tap opens the list)
popup cx=464 cy=115 w=120 h=38 label="SPEED" key=speed field=none accent=eef1f4 cols=1 cw=120 options="Fast,Medium,Slow"

# the analyzer: a switch in the header, and a 72-column haze behind the curve (display only)
